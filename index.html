<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <meta
      name="description"
      content="Mini app de League of Legends basada en la pestaña Composición del Excel."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <title>LoL Team Analyzer</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Rift Architect</p>
          <h1>LoL Team Analyzer</h1>
          <p class="subhead">
            La app replica la pestaña <strong>Composición</strong> leyendo el Excel del repositorio.
          </p>
        </div>
        <div class="status-pill" id="statusPill">Listo</div>
      </header>

      <section class="card form-card">
        <div class="card-head">
          <h2>Composición</h2>
          <p>Rellena los 5 roles y pulsa analizar.</p>
        </div>

        <div class="roles-grid">
          <label>
            <span>Top</span>
            <input id="top" list="championList" type="text" placeholder="Aatrox" />
          </label>
          <label>
            <span>Jungla</span>
            <input id="jungle" list="championList" type="text" placeholder="Briar" />
          </label>
          <label>
            <span>Mid</span>
            <input id="mid" list="championList" type="text" placeholder="Anivia" />
          </label>
          <label>
            <span>Botline</span>
            <input id="adc" list="championList" type="text" placeholder="Draven" />
          </label>
          <label>
            <span>Support</span>
            <input id="support" list="championList" type="text" placeholder="Janna" />
          </label>
        </div>

        <div class="actions">
          <button id="analyzeBtn">Analizar</button>
          <button id="demoBtn" class="secondary">Cargar ejemplo</button>
        </div>
      </section>

      <section class="card result-card">
        <div class="card-head">
          <h2>Resultado</h2>
          <p>Salida igual al Excel.</p>
        </div>
        <div id="result" class="result-empty">Aquí aparecerá la tabla Composición.</div>
      </section>
    </main>

    <datalist id="championList"></datalist>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
