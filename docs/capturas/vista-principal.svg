<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Captura de referencia de la vista principal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:700 44px Inter,Segoe UI,Arial,sans-serif; fill:#fff}
      .sub{font:400 18px Inter,Segoe UI,Arial,sans-serif; fill:#a4adbc}
      .label{font:700 16px Inter,Segoe UI,Arial,sans-serif; fill:#b9c2d0; letter-spacing:.1em; text-transform:uppercase}
      .h2{font:700 24px Inter,Segoe UI,Arial,sans-serif; fill:#fff}
      .txt{font:600 18px Inter,Segoe UI,Arial,sans-serif; fill:#edf2f7}
      .muted{font:400 14px Inter,Segoe UI,Arial,sans-serif; fill:#a4adbc}
      .small{font:500 12px Inter,Segoe UI,Arial,sans-serif; fill:#d6dce5}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="820" cy="0" rx="520" ry="230" fill="rgba(226,41,47,0.18)"/>

  <g filter="url(#shadow)">
    <rect x="56" y="36" width="1488" height="82" rx="22" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)"/>
    <text x="92" y="74" class="label">Rift Architect</text>
    <text x="92" y="106" class="title" style="font-size:30px">LoL Team Analyzer</text>
    <rect x="1375" y="54" width="140" height="46" rx="999" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="1410" y="82" class="sub" style="font-size:16px">Listo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="144" width="1488" height="286" rx="28" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <text x="88" y="192" class="h2">Composición</text>
    <text x="88" y="220" class="sub">Rellena los 5 roles. Cada uno usa su propia tabla.</text>

    <g>
      <rect x="88" y="248" width="262" height="112" rx="18" fill="#0f131a" stroke="rgba(255,255,255,0.08)"/>
      <text x="108" y="276" class="muted">Top</text>
      <rect x="108" y="291" width="222" height="42" rx="12" fill="#11161f" stroke="rgba(255,255,255,0.08)"/>
      <text x="124" y="318" class="txt" style="font-size:16px">Aatrox</text>
      <circle cx="134" cy="312" r="10" fill="#2b313f"/>
    </g>

    <g>
      <rect x="370" y="248" width="262" height="112" rx="18" fill="#0f131a" stroke="rgba(255,255,255,0.08)"/>
      <text x="390" y="276" class="muted">Jungla</text>
      <rect x="390" y="291" width="222" height="42" rx="12" fill="#11161f" stroke="rgba(255,255,255,0.08)"/>
      <text x="406" y="318" class="txt" style="font-size:16px">Briar</text>
      <circle cx="416" cy="312" r="10" fill="#2b313f"/>
    </g>

    <g>
      <rect x="652" y="248" width="262" height="112" rx="18" fill="#0f131a" stroke="rgba(255,255,255,0.08)"/>
      <text x="672" y="276" class="muted">Mid</text>
      <rect x="672" y="291" width="222" height="42" rx="12" fill="#11161f" stroke="rgba(255,255,255,0.08)"/>
      <text x="688" y="318" class="txt" style="font-size:16px">Ahri</text>
      <circle cx="698" cy="312" r="10" fill="#2b313f"/>
    </g>

    <g>
      <rect x="934" y="248" width="262" height="112" rx="18" fill="#0f131a" stroke="rgba(255,255,255,0.08)"/>
      <text x="954" y="276" class="muted">Botline</text>
      <rect x="954" y="291" width="222" height="42" rx="12" fill="#11161f" stroke="rgba(255,255,255,0.08)"/>
      <text x="970" y="318" class="txt" style="font-size:16px">Jinx</text>
      <circle cx="980" cy="312" r="10" fill="#2b313f"/>
    </g>

    <g>
      <rect x="1216" y="248" width="262" height="112" rx="18" fill="#0f131a" stroke="rgba(255,255,255,0.08)"/>
      <text x="1236" y="276" class="muted">Support</text>
      <rect x="1236" y="291" width="222" height="42" rx="12" fill="#11161f" stroke="rgba(255,255,255,0.08)"/>
      <text x="1252" y="318" class="txt" style="font-size:16px">Leona</text>
      <circle cx="1262" cy="312" r="10" fill="#2b313f"/>
    </g>

    <rect x="88" y="380" width="178" height="40" rx="12" fill="#e2292f"/>
    <text x="126" y="406" class="txt" style="font-size:16px; fill:#fff">Analizar</text>
    <rect x="278" y="380" width="204" height="40" rx="12" fill="rgba(255,255,255,0.07)"/>
    <text x="312" y="406" class="txt" style="font-size:16px; fill:#edf2f7">Limpiar selección</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="456" width="1488" height="388" rx="28" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
    <text x="88" y="504" class="h2">Resultado</text>
    <text x="88" y="532" class="sub">Salida igual al Excel.</text>

    <rect x="88" y="560" width="1400" height="58" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="108" y="597" class="txt" style="font-size:18px">Vista rápida · Composición lista · 5/5 campeones detectados</text>

    <rect x="88" y="632" width="1400" height="162" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="108" y="666" class="label" style="font-size:14px">Sinergia global</text>
    <text x="108" y="698" class="sub" style="font-size:16px">Resumen compacto · Identidades, funciones y ritmo del equipo</text>

    <g>
      <rect x="108" y="720" width="160" height="36" rx="999" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
      <text x="130" y="744" class="small">Tanque · 2</text>
      <rect x="282" y="720" width="160" height="36" rx="999" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
      <text x="304" y="744" class="small">Engage · 2</text>
      <rect x="456" y="720" width="160" height="36" rx="999" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)"/>
      <text x="478" y="744" class="small">Escalado · 3</text>
    </g>
  </g>

  <rect x="1400" y="842" width="128" height="34" rx="12" fill="rgba(17,19,24,0.92)" stroke="rgba(255,255,255,0.12)"/>
  <text x="1420" y="864" class="small">v1.2.0 · Preview</text>
</svg>