name: Stage 1 Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run consolidated audit
        run: npm run audit:all

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: stage1-audit-reports
          path: |
            workbook-report.json
            composition-validation-report.json
            tests/composition.validation.json
          if-no-files-found: error
